# Evaluation only. This file never creates or modifies train/validation/test splits.
# `cond_upsample_mode: bicubic` is loaded from the experiment's saved project config.
experiment:
  path: logs/2026-08-07T16-26-21_ldm_sr_32_256_e181_bicubic
  project_config: null  # inferred from experiment/configs when null
  checkpoints:
    - epoch=000000.ckpt
    - epoch=000295.ckpt
    - epoch=000314.ckpt

evaluation:
  split: test
  lr_size: 32
  scale_ratio: 8
  sample_counts: [-1]  # evaluates the complete existing test manifest
  ddim_steps: [100, 200]
  eta: 0.0
  seed: 23

runtime:
  batch_size: 8
  device: cuda
  use_ema: true
  lpips: false

output:
  metrics_dir: logs/evaluation/2026-08-07T16-26-21_ldm_sr_32_256_e181_bicubic
  tag: x8_bicubic
  save_metrics: true
  save_images: false
  verbose: false
