model:
  base_learning_rate: 1.0e-07
  target: ldm.models.diffusion.ddpm.SRDiffusion
  params:
    cond_upsample_mode: bicubic
    linear_start: 0.0001
    linear_end: 0.015
    log_every_t: 100
    timesteps: 1000
    first_stage_key: image_hr
    cond_stage_key: image_lr
    image_size: 64
    channels: 8
    inp_size: 256
    default_output_size: 256
    c_encode: True
    conditioning_key: concat
    concat_mode: True
    cond_stage_trainable: False
    monitor: val/psnr
    scale_by_std: True

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 64
        in_channels: 16
        out_channels: 8
        model_channels: 256
        # Downsampling factors 2, 4, and 8 correspond to attention at
        # spatial resolutions 32, 16, and 8, matching the x8 baseline.
        attention_resolutions: [8, 4, 2]
        num_res_blocks: 2
        channel_mult: [1, 2, 4, 4]
        num_head_channels: 32

    first_stage_config:
      target: ldm.models.firststagemodel.FirstStageModel
      params:
        # Replace this path with the checkpoint produced by
        # first_stage_sr_64_256_deterministic.yaml before stage-two training.
        ckpt_path: logs/FIRST_STAGE_DETERMINISTIC_X4_Z8/checkpoints/last.ckpt
        lossconfig:
          target: torch.nn.Identity

        ddconfig:
          double_z: False
          z_channels: 8
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult: [1, 2, 4]
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0

        liifconfig:
          hidden_list: [256, 256, 256, 256]
          cell_decode: True
          local_ensemble: True

    cond_stage_config:
      target: torch.nn.Identity

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 8
    wrap: True
    train:
      target: ldm.data.datasets.CTSRTrain
      params:
        size: 256
        lr_size: 32
    validation:
      target: ldm.data.datasets.CTSRValidation
      params:
        size: 256
        lr_size: 32
        first_k: 100

lightning:
  modelcheckpoint:
    params:
      mode: max
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 5000
        max_images: 4
        increase_log_steps: False
        log_first_step: True
        log_images_kwargs:
          plot_denoise_rows: True
